[pytest]
# Pytest konfiguratsiyasi

# Test papkalari
testpaths = tests

# Foydalaniladigan Python modullari
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# markers
markers =
    slow: Sekin testlar (davomiyligi ko'p)
    integration: Integration testlar
    unit: Unit testlar
    api: API testlar

# xavfsizlik
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Asyncio
asyncio_mode = auto

# Coverage (agar kerak bo'lsa)
# --cov=handlers
# --cov=utils
# --cov=database
# --cov-report=html
# --cov-report=term-missing
