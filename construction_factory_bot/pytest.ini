[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --timeout=120
    --timeout-method=thread
    -q
asyncio_mode = auto
markers =
    slow: sekin testlar (odatda o'tkazib yuborish mumkin)
    integration: integratsiya testlari
    unit: unit testlar
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:reportlab.*
    ignore::UserWarning:matplotlib.*
