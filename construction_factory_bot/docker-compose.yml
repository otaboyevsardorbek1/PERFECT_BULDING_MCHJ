# ============================================================
# 🏗️ Qurilish Korxonasi — docker-compose (TZ: Deploy bo'limi)
#
#   1) cp .env.example .env     # BOT_TOKEN, ADMIN_IDS va boshqa kalitlar
#   2) docker compose up -d --build
#
# Xizmatlar:
#   api   -> FastAPI REST API  (http://localhost:8000, /health tekshiruvi bilan)
#   web   -> Node.js frontend  (http://localhost:3000)  /api -> api:8000
#   bot   -> Telegram bot (aiogram polling)
#
# Ma'lumotlar (SQLite construction.db, backups, logs, reports) shared volume'da
# saqlanadi — konteyner qayta yaratilsa ham yo'qolmaydi.
# ============================================================

services:
  api:
    build: .
    image: construction-factory-bot:latest
    restart: unless-stopped
    command: python -m uvicorn dashboard.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      - SQLITE_DB_PATH=database/construction.db
      - PYTHONUNBUFFERED=1
    volumes:
      - ./database:/app/database
      - ./backups:/app/backups
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./static/uploads:/app/static/uploads
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build: .
    image: construction-factory-bot:latest
    restart: unless-stopped
    command: node web/server.js
    environment:
      - PORT=3000
      - PY_API_URL=http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  bot:
    build: .
    image: construction-factory-bot:latest
    restart: unless-stopped
    command: python main.py
    env_file: .env
    environment:
      - SQLITE_DB_PATH=database/construction.db
      - PYTHONUNBUFFERED=1
    volumes:
      - ./database:/app/database
      - ./backups:/app/backups
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./static/uploads:/app/static/uploads
    depends_on:
      - api

  # ============================================================
  # Chaos Engineering Runner — rejalangan sinovlar
  # TZ: "Har oyda chaos testing (pod kill, network delay, DB failover)"
  # ============================================================
  chaos-runner:
    build: .
    image: construction-factory-bot:latest
    restart: "no"  # faqat kerak bo'lganda ishga tushiriladi
    command: bash infra/chaos/run-chaos.sh slo-check
    environment:
      - SQLITE_DB_PATH=database/construction.db
      - PYTHONUNBUFFERED=1
    volumes:
      - ./database:/app/database
      - ./infra/chaos:/app/infra/chaos
      - /tmp/chaos-reports:/tmp/chaos-reports
    depends_on:
      - api
    profiles:
      - chaos  # docker compose --profile chaos up chaos-runner

  # ============================================================
  # Event Store Worker — snapshot yaratish va read model yangilash
  # TZ: "Event Sourcing — vaqtinchalik snapshot, CQRS read model"
  # ============================================================
  event-worker:
    build: .
    image: construction-factory-bot:latest
    restart: unless-stopped
    command: python -c "
import time, sys
sys.path.insert(0, '.')
from database.session import get_db_session
from utils.event_store import refresh_read_models, SNAPSHOT_INTERVAL
import logging
logging.basicConfig(level=logging.INFO)
logger = logging.getLogger('event-worker')
logger.info('Event Store Worker ishga tushdi')
while True:
    try:
        with get_db_session() as db:
            refresh_read_models(db)
            logger.info('Read model\'lar yangilandi')
    except Exception as e:
        logger.error(f'Event worker xato: {e}')
    time.sleep(300)  # har 5 daqiqada yangilash
"
    env_file: .env
    environment:
      - SQLITE_DB_PATH=database/construction.db
      - PYTHONUNBUFFERED=1
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
    depends_on:
      - api