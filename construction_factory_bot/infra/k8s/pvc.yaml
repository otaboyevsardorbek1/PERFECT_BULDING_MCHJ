# ============================================================
# PersistentVolumeClaims — Database va Backup uchun
# ============================================================
# TZ: "RPO ≤ 1 soat — har 6 soatda to'liq backup"
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qurilish-db-pvc
  namespace: qurilish-prod
  labels:
    app: qurilish-api
    purpose: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: gp3  # AWS gp3 (yuqori tezlik)

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qurilish-backups-pvc
  namespace: qurilish-prod
  labels:
    app: qurilish-api
    purpose: backups
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: sc1  # AWS sc1 (arzon, kam tezlik)

---
# ============================================================
# NetworkPolicy — Ichki tarmoqni himoya qilish
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qurilish-network-policy
  namespace: qurilish-prod
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # API: faqat web va bot'dan kirish
  - from:
    - podSelector:
        matchLabels:
          app: qurilish-web
    - podSelector:
        matchLabels:
          app: qurilish-bot
    ports:
    - port: 8000
  # Web: Ingress controller'dan kirish
  - from:
    - podSelector:
        matchLabels:
          app: ingress-nginx
    ports:
    - port: 3000
  egress:
  # Barcha pod'lar DNS uchun
  - to: []
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  # API → PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          app: postgresql
    ports:
    - port: 5432
  # Bot → Telegram API
  - to: []
    ports:
    - port: 443
      protocol: TCP
