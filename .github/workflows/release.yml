# .github/workflows/release.yml
name: 🚀 Release & Docker Build

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  release-docker:
    name: 🐳 GitHub Release va Docker
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release yaratish uchun ruxsat
      packages: write # GitHub Packages ga yuklash uchun ruxsat

    steps:
      - name: 📥 Repozitoriyani yuklash
        uses: actions/checkout@v4
      
      - name: 🐳 Docker Buildx ni sozlash
        uses: docker/setup-buildx-action@v3
      
      - name: 🔐 GitHub Container Registry'ga kirish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Bu avtomatik mavjud, sozlash shart emas
      
      - name: 🏗️ Docker Image yig'ish va yuklash
        uses: docker/build-push-action@v5
        with:
          context: ./construction_factory_bot
          push: true
          tags: ghcr.io/${{ github.repository }}/construction-bot:latest