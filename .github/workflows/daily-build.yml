# .github/workflows/daily-build.yml
name: 🌙 Daily Build & Health Check

on:
  schedule:
    - cron: '0 0 * * *' # Har kuni yarim tunda
  workflow_dispatch: # Qo'lda ishga tushirish

jobs:
  daily-build:
    name: Kunlik Tekshiruv
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Repozitoriyani yuklash
        uses: actions/checkout@v4
      
      - name: 🐍 Python va Node.js sozlash
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          
      - name: 🟢 Node.js sozlash
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: 📦 Bog'liqliklarni o'rnatish
        run: |
          cd construction_factory_bot
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then 
            sed -i 's/^psycopg2-binary/# psycopg2-binary/; s/^asyncpg/# asyncpg/' requirements.txt
            pip install -r requirements.txt; 
          fi
          
      - name: 🧪 Kunlik testlarni ishga tushirish
        env:
          TEST_MODE: "true"
          BOT_TOKEN: "test_token_1234567890:ABCDEFGHIJKLMNOPQRSTUVWXYZ"
          ADMIN_IDS: "123456789"
          SQLITE_DB_PATH: "/tmp/ci_construction.db"
          USE_POSTGRESQL: "false"
        run: |
          cd construction_factory_bot
          pytest tests/ -q --timeout=120 || echo "⚠️ Testlarda xatolik bor, lekin davom etamiz"
          
      - name: 📊 Natijalarni saqlash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-test-results
          path: construction_factory_bot/test-results/
          retention-days: 14
          if-no-files-found: warn